name: orderbox_dz
description: "OrderBox DZ — a premium order manager for Algerian online sellers."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  shared_preferences: ^2.5.6
  intl: ^0.20.3
  url_launcher: ^6.3.3
  fl_chart: ^1.3.1
  flutter_animate: ^4.5.2
  flutter_riverpod: ^3.5.0
  riverpod_annotation: ^4.0.8
  drift: ^2.35.4
  drift_flutter: ^0.3.1
  sqlite3_flutter_libs: ^0.6.0+eol
  path_provider: ^2.1.6
  share_plus: ^13.3.1
  csv: ^8.0.0
  collection: ^1.19.1
  equatable: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.8
  flutter_launcher_icons: ^0.14.4
  riverpod_generator: ^4.0.10
  drift_dev: ^2.35.3
  build_runner: ^2.17.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/poppins-regular.ttf
          weight: 400
        - asset: assets/fonts/poppins-medium.ttf
          weight: 500
        - asset: assets/fonts/poppins-semibold.ttf
          weight: 600
        - asset: assets/fonts/poppins-bold.ttf
          weight: 700
    - family: Cairo
      fonts:
        - asset: assets/fonts/cairo-regular.ttf
          weight: 400
        - asset: assets/fonts/cairo-medium.ttf
          weight: 500
        - asset: assets/fonts/cairo-semibold.ttf
          weight: 600
        - asset: assets/fonts/cairo-bold.ttf
          weight: 700

flutter_native_splash:
  color: "#5B2EE0"
  color_dark: "#2B1173"
  image: assets/images/logo_mark.png
  image_dark: assets/images/logo_mark.png
  android: true
  ios: true
  web: true
  android_gravity: center
  ios_content_mode: center
  fullscreen: true
  android_12:
    color: "#5B2EE0"
    color_dark: "#2B1173"
    image: assets/images/logo_mark.png
    image_dark: assets/images/logo_mark.png
    icon_background_color: "#5B2EE0"
    icon_background_color_dark: "#2B1173"

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: assets/images/app_icon.png
  min_sdk_android: 23
  remove_alpha_ios: true
  adaptive_icon_background: "#5B2EE0"
  adaptive_icon_foreground: assets/images/app_icon_foreground.png
  web:
    generate: true
    image_path: assets/images/app_icon.png
    background_color: "#5B2EE0"
    theme_color: "#5B2EE0"
  windows:
    generate: true
    image_path: assets/images/app_icon.png
    icon_size: 256
